[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package]
name = "text-processing-engine"
version = "0.1.0"
edition = "2024"
description = "Native PDF text, metadata and citation extraction engine for academic corpora"
license = "MIT"

[[bin]]
name = "tpe"
path = "src/main.rs"

[lib]
name = "tpe"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
lopdf = "0.45"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
