[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
# Mirrors the root package version; tag-derived Rust versions are tracked separately.
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package]
name = "text-processing-engine"
version = "0.1.0"
edition = "2024"
description = "Native PDF text, metadata and citation extraction engine for academic corpora"
license = "MIT"

[[bin]]
name = "tpe"
path = "src/main.rs"

[lib]
name = "tpe"
path = "src/lib.rs"

[features]
default = []
# Native PDFium backend (`--backend pdfium`); needs libpdfium at run time (docs/NATIVE.md).
pdfium = ["dep:pdfium-render"]
# docling.rs backends (`docling-text`, `docling`); `docling` needs PDFium and the models.
docling = ["dep:docling-pdf", "dep:docling-core", "pdfium"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
docling-core = { version = "1.69", optional = true }
docling-pdf = { version = "1.69", optional = true }
flate2 = "1"
hex = "0.4"
lopdf = "0.45"
# Same major as docling-pdf (0.8) so one pdfium-render instance links libpdfium.
# No `image` feature here; docling-pdf turns it on for itself under `docling`.
pdfium-render = { version = "0.8", optional = true, default-features = false, features = ["pdfium_latest", "thread_safe"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
unicode-normalization = "0.1"
ureq = "3"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
