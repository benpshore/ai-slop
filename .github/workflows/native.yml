name: Native

# Builds and tests the engine with the native backends (`docling`, `pdfium`)
# against the artifacts pinned in native/manifest.json, then runs each backend
# evaluation on the dev split (docs/NATIVE.md, docs/EVAL.md). Not part of the
# required `ci` check: it needs the network for PDFium, the docling models, ONNX
# Runtime and the corpus, and the metrics are diagnostic.

on:
  workflow_dispatch:
  # On pull requests only when the native backends or their pins can change;
  # engine-only PRs are covered by `ci`, and every merge to main still runs
  # the full native evaluation below.
  pull_request:
    paths:
      - native/**
      - src/backend/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/native.yml
  push:
    branches: [main]
    paths:
      - native/**
      - src/**
      - tests/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/native.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # A release build plus a test build of docling-pdf/ONNX Runtime are two
    # full dependency builds on a cold cache.
    timeout-minutes: 90
    env:
      # docling-pdf binds PDFium from here (a directory or a file); the models
      # resolve from `.models/` under the CWD, then this directory (which is the
      # `.models` directory itself, not its parent).
      PDFIUM_DYNAMIC_LIB_PATH: ${{ github.workspace }}/.pdfium/lib
      DOCLING_RS_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: rustup show active-toolchain
      - run: rustc --version --verbose && uname -m
      # ONNX Runtime is not provisioned by native/fetch.sh: the `ort` crate
      # (enabled by docling-pdf with `download-binaries`) downloads a prebuilt
      # ONNX Runtime in its build script, so it lands under target/ and is
      # reused through this cache. The ~/.cache and ~/Library/Caches paths are
      # where ort-sys is expected to keep its download cache (not verified;
      # missing paths only produce a cache warning).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/ort.pyke.io
            ~/Library/Caches/ort.pyke.io
            target
          key: cargo-native-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-native-${{ matrix.os }}-
      # PDFium differs per platform, so the key includes the OS; any change to
      # the manifest (a new URL or a pinned hash) invalidates it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .models
            .pdfium
          key: native-assets-${{ matrix.os }}-${{ hashFiles('native/manifest.json') }}
      - name: Provision PDFium and the docling models (prints file, bytes, sha256)
        run: sh native/fetch.sh
      - run: cargo build --locked --release --features docling,pdfium
      # --nocapture so the "skipped: ..." lines of the native smoke tests show
      # in the log: with the artifacts present, none of them should appear.
      - run: cargo clippy --locked --all-targets --features docling,pdfium -- -D warnings
      - run: cargo test --locked --features docling,pdfium -- --nocapture
      # `tpe backends` (lists compiled-in backends and whether their native
      # dependencies load) is added in the same batch by another change;
      - name: List backends
        if: ${{ !cancelled() }}
        run: ./target/release/tpe backends
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          path: .corpus-cache
          key: corpus-${{ hashFiles('corpus/manifest.json') }}
          restore-keys: corpus-
      - name: Fetch the corpus (cached items are reused)
        if: ${{ !cancelled() }}
        run: ./target/release/tpe corpus fetch --manifest corpus/manifest.json --cache .corpus-cache --split dev
      - name: Evaluate the lopdf baseline on the same runner and corpus
        if: ${{ !cancelled() }}
        run: uv run python native/measure_eval.py --backend lopdf --out eval-native/lopdf
      - name: Evaluate the pdfium backend
        if: ${{ !cancelled() }}
        run: uv run python native/measure_eval.py --backend pdfium --out eval-native/pdfium
      - name: Evaluate the docling-text backend
        if: ${{ !cancelled() }}
        run: uv run python native/measure_eval.py --backend docling-text --out eval-native/docling-text
      - name: Evaluate the docling backend (full layout + OCR)
        if: ${{ !cancelled() }}
        run: uv run python native/measure_eval.py --backend docling --out eval-native/docling
      - name: Require complete successful evaluation coverage
        if: ${{ !cancelled() }}
        run: |
          for b in lopdf pdfium docling-text docling; do
            uv run python native/validate_eval.py --manifest corpus/manifest.json --split dev --backend "$b" --report "eval-native/$b/report.json"
          done
      - name: Publish the reports in the job summary
        if: ${{ !cancelled() }}
        run: |
          for b in lopdf pdfium docling-text docling; do
            if [ -f "eval-native/$b/report.md" ]; then
              { echo "# $b"; cat "eval-native/$b/report.md"; echo; } >> "$GITHUB_STEP_SUMMARY"
              if [ -f "eval-native/$b/resources.json" ]; then
                { echo; echo '```json'; cat "eval-native/$b/resources.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "# $b: no report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: native-eval-${{ matrix.os }}
          path: eval-native
