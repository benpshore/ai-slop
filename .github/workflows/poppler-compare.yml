name: Poppler comparison

on:
  pull_request:
    paths:
      - scripts/compare_poppler.py
      - .github/workflows/poppler-compare.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-ubuntu-24.04-arm-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-release-ubuntu-24.04-arm-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .corpus-cache
          key: corpus-${{ hashFiles('corpus/manifest.json') }}
          restore-keys: corpus-
      - name: Install Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Select five pinned scholarly PDFs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          ids = {
              "arxiv:2309.10334",  # bibliography without heading
              "arxiv:2401.15719",  # author-year markers
              "arxiv:2509.12458",  # numeric labels
              "arxiv:2510.26824",  # superscript markers
              "arxiv:2410.17124",  # tables/reading order
          }
          manifest = json.loads(Path("corpus/manifest.json").read_text())
          manifest["items"] = [x for x in manifest["items"] if x["id"] in ids]
          assert len(manifest["items"]) == len(ids)
          Path("comparison-manifest.json").write_text(json.dumps(manifest))
          PY
      - name: Build and fetch pinned corpus
        run: |
          cargo build --locked --release
          ./target/release/tpe corpus fetch --manifest comparison-manifest.json --cache .corpus-cache
      - name: Compare
        run: |
          ./target/release/tpe eval --manifest comparison-manifest.json --cache .corpus-cache --out comparison-eval --dump-dir comparison-eval/dumps --split all --offline
          python3 scripts/compare_poppler.py comparison-manifest.json .corpus-cache comparison-eval comparison-out ./target/release/tpe
          cat comparison-out/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Export three PDFs and complete extracted page text for visual audit
        run: |
          mkdir -p audit-out audit-extract
          for id in 2309.10334 2401.15719 2509.12458; do
            pdf=".corpus-cache/arxiv_${id}/paper.pdf"
            ./target/release/tpe extract "$pdf" --db audit.sqlite --out audit-extract
            cp "$pdf" "audit-out/arxiv_${id}.pdf"
            hash="$(sha256sum "$pdf" | cut -d' ' -f1)"
            cp "audit-extract/${hash}.txt" "audit-out/arxiv_${id}.tpe.txt"
          done
          du -h audit-out/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-audit-inputs
          path: audit-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: poppler-comparison
          path: |
            comparison-manifest.json
            comparison-eval/report.json
            comparison-eval/dumps
            comparison-out
