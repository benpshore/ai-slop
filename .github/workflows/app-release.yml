name: App release

# Builds PDFTextract.app at a release tag on a macOS runner, runs the App
# workflow's checks on that tag (fmt, clippy, tests, bundle smoke test), and
# attaches the zipped, ad-hoc-signed app and its checksum to that release.
# It never replaces an asset: if either is already attached it stops. The
# write token is given only to the two `gh` steps, never to the build. Run by hand
# (Actions > App release > Run workflow); nothing triggers it, so it adds no
# macOS runs to merges or pull requests. The release itself is still made by
# auto-release.yml; this only adds the app to it.
#
# The bundle is signed ad hoc and not notarized: after downloading, macOS
# asks for confirmation on first launch (right-click > Open), or run
# `xattr -dr com.apple.quarantine PDFTextract.app` once (docs/APP.md).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (default: the latest release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  app-release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG_INPUT: ${{ inputs.tag }}
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${TAG_INPUT:-}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          # Exactly v<digits>.<digits>.<digits>, nothing before or after.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: $tag"
            exit 1
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          version="${tag#v}"
          # Never replace a published asset (a failed replacement upload would
          # leave the release without it): stop here, before the long build.
          names=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for want in "PDFTextract-${version}-macos-arm64.zip" "PDFTextract-${version}-macos-arm64.zip.sha256"; do
            if printf '%s\n' "$names" | grep -Fxq "$want"; then
              echo "::error::$want is already attached to $tag; remove it (gh release delete-asset $tag $want) to publish again"
              exit 1
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag contains the app
        run: |
          test -f crates/tpe-app/bundle.sh || {
            echo "::error::${{ steps.tag.outputs.tag }} has no crates/tpe-app/bundle.sh; build a release made after the app landed"
            exit 1
          }
      - run: rustup component add clippy rustfmt
      - run: rustc --version --verbose && uname -m
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-app-macos-15-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-app-macos-15-
      # The App workflow's checks, on the tagged source, so a macOS-only
      # regression cannot be published.
      - run: cargo fmt --check -p tpe-app
      - run: cargo clippy -p tpe-app --all-targets -- -D warnings
      - run: cargo test -p tpe-app
      - name: Build the bundle at the tag's version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: sh crates/tpe-app/bundle.sh
      - name: Bundle smoke test
        run: |
          set -eu
          APP=target/release/PDFTextract.app
          test -x "$APP/Contents/MacOS/PDFTextract"
          plutil -extract NSServices json -o - "$APP/Contents/Info.plist"
          plutil -extract CFBundleDocumentTypes json -o - "$APP/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$APP"
      - name: Package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -eu
          name="PDFTextract-${VERSION}-macos-arm64.zip"
          ditto -c -k --keepParent target/release/PDFTextract.app "$name"
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
          echo "ZIP=$name" >> "$GITHUB_ENV"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          # Checked again: another run may have attached it during the build.
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for want in "$ZIP" "$ZIP.sha256"; do
            if printf '%s\n' "$names" | grep -Fxq "$want"; then
              echo "::error::$want is already attached to $TAG; not replacing it"
              exit 1
            fi
          done
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --repo "$GITHUB_REPOSITORY"
          echo "Attached $ZIP to $TAG" >> "$GITHUB_STEP_SUMMARY"
