name: macOS 26

on:
  workflow_dispatch:
  pull_request:
    paths:
      - macos/**
      - crates/tpe-app/**
      - Cargo.toml
      - Cargo.lock
      - Package.swift
      - .github/workflows/macos-26.yml
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # macos-26 is the dedicated arm64 macOS 26 runner image. Keep the explicit
    # DEVELOPER_DIR: an image update must not silently change the compiler/SDK.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the documented toolchain
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(xcodebuild -version | paste -sd ' ' -)" = "Xcode 26.0 Build version 17A324"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.0
          test "$(swift --version | sed -n '1s/.*version \([0-9][0-9.]*\).*/\1/p')" = 6.2
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Swift tests, including NSItemProvider share smoke
        run: |
          swift test
          swift test --package-path macos
      - name: Build host application and Share extension
        run: ./macos/build-bundle.sh
      - name: Validate bundle metadata, sandbox and hardened runtime
        run: ./macos/validate-bundle.sh build/macos/TPE.app
      - name: Launch and Finder-open smoke tests
        run: ./macos/smoke-tests.sh build/macos/TPE.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unsigned-macos-26-validation-bundle
          path: build/macos/TPE.app
