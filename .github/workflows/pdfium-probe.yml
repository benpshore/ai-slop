name: PDFium Unicode checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/backend/pdfium_backend.rs
      - src/backend/pdfium_backend/**
      - src/pipeline.rs
      - src/router.rs
      - src/schema.rs
      - tests/pdfium_unicode.rs
      - tests/fixtures/pdfium-unicode/**
      - Cargo.toml
      - Cargo.lock
      - native/manifest.json
      - .github/workflows/pdfium-probe.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            extension: so
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            extension: so
          - os: macos-15
            platform: mac-arm64
            extension: dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PDFIUM_PLATFORM: ${{ matrix.platform }}
      PDFIUM_EXTENSION: ${{ matrix.extension }}
      PDFIUM_DYNAMIC_LIB_PATH: ${{ github.workspace }}/.pdfium/lib
      TPE_PDFIUM_PROBE_EVIDENCE_DIR: ${{ github.workspace }}/out/pdfium-probe
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - run: rustc --version --verbose && uname -m
      - name: Fetch only the pinned PDFium library, verifying archive and library
        shell: bash
        run: |
          set -euo pipefail
          entry=$(jq -ce '[.entries[] | select(.kind == "pdfium" and .platform == env.PDFIUM_PLATFORM)] | if length == 1 then .[0] else error("expected one PDFium pin") end' native/manifest.json)
          pdfium_url=$(jq -er '.url' <<< "$entry")
          archive_sha=$(jq -er '.archive_sha256 | select(test("^[a-f0-9]{64}$"))' <<< "$entry")
          library_sha=$(jq -er '.sha256 | select(test("^[a-f0-9]{64}$"))' <<< "$entry")
          curl --fail --location --retry 3 "$pdfium_url" -o pdfium.tgz
          printf '%s  pdfium.tgz\n' "$archive_sha" | shasum -a 256 --check
          mkdir -p .pdfium out/pdfium-probe
          tar -xzf pdfium.tgz -C .pdfium "lib/libpdfium.$PDFIUM_EXTENSION"
          printf '%s  .pdfium/lib/libpdfium.%s\n' "$library_sha" "$PDFIUM_EXTENSION" | shasum -a 256 --check
          git rev-parse HEAD > out/pdfium-probe/code-sha.txt
          rustc --version --verbose > out/pdfium-probe/toolchain.txt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --features pdfium -- -D warnings
      - run: cargo test --locked --features pdfium --lib backend::pdfium_backend::unicode_mapping::tests -- --nocapture
      - run: cargo test --locked --features pdfium --test pdfium_unicode -- --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pdfium-evidence-${{ matrix.platform }}
          path: out/pdfium-probe
          if-no-files-found: error
