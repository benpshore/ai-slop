name: Engineering project sync

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [opened, edited, reopened, closed, synchronize, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'

# A Projects PAT is needed because GITHUB_TOKEN cannot manage user Projects.
# It is exposed only to the trusted default-branch script below. This workflow
# must never check out, import, or execute code from a PR's head or artifact.
permissions:
  contents: read

concurrency:
  group: engineering-project-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'benpshore/pdftextract' && vars.PROJECT_NUMBER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile project and reciprocal issue/PR references
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          test -n "$GH_TOKEN" || { echo '::error::Configure PROJECTS_TOKEN using docs/PROJECT_SETUP.md'; exit 1; }
          python3 scripts/sync_github_project.py --apply \
            --project-number "$PROJECT_NUMBER" --report "$RUNNER_TEMP/project-sync.json"
      - name: Preserve exact card statuses and project URL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-project-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/project-sync.json
          if-no-files-found: warn
          retention-days: 30
