name: Build binaries

# Reusable: build the `tpe` command-line binary for every supported target
# and upload one artifact per target named `tpe-<target>` containing
# `tpe-<target>.tar.gz` (a single file `tpe` inside). The archive name is
# the contract `tpe update`, mise (`github:` backend) and the install
# instructions in docs/CLI.md rely on. `version` is embedded through the
# `TPE_VERSION` build-time environment variable (build.rs); the conventional
# leading v is removed for `tpe --version`.

on:
  workflow_call:
    inputs:
      version:
        description: Release tag being built, e.g. v0.42.0
        type: string
        required: true
  # Dry run on pull requests that touch this file: builds every target and
  # uploads the archives as artifacts; nothing is released.
  pull_request:
    paths:
      - .github/workflows/build-binaries.yml
      - rust-toolchain.toml
      - build.rs
  # Isolated alpha artifacts; this does not publish a release or merge the stack.
  push:
    branches: [codex/cli-alpha-bounded-extraction]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TPE_VERSION: ${{ inputs.version || format('v0.0.0-alpha-{0}', github.sha) }}
      ALPHA_CANDIDATE: ${{ !inputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: rustc --version --verbose && uname -m
      - name: Runner architecture matches the target
        run: |
          case "$TARGET" in
            aarch64-*) test "$(uname -m)" = arm64 || test "$(uname -m)" = aarch64 ;;
            x86_64-*)  test "$(uname -m)" = x86_64 ;;
          esac
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-bin-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-bin-${{ matrix.target }}-
      - name: Build tpe
        run: cargo build --release --locked -p text-processing-engine --bin tpe
      - name: Smoke test
        run: |
          set -eu
          expected=${TPE_VERSION#v}
          actual=$(./target/release/tpe --version)
          test "$actual" = "tpe $expected"
          printf '%s\n' "$actual"
          ./target/release/tpe backends
      - name: Test the release CLI on the native runner
        run: cargo test --release --locked -p text-processing-engine --test cli_alpha --test end_to_end -- --test-threads=2
      - name: Record source and native execution evidence
        run: |
          set -eu
          mkdir -p dist
          {
            git rev-parse HEAD
            git rev-parse HEAD^{tree}
            rustc --version --verbose
            uname -a
            file target/release/tpe
            shasum -a 256 target/release/tpe Cargo.lock rust-toolchain.toml
            ./target/release/tpe --version
            ./target/release/tpe backends
          } > "dist/BUILD-INFO-$TARGET.txt"
          if [ "$RUNNER_OS" = macOS ]; then
            sw_vers >> "dist/BUILD-INFO-$TARGET.txt"
            otool -L target/release/tpe >> "dist/BUILD-INFO-$TARGET.txt"
            codesign -d --verbose=4 target/release/tpe >> "dist/BUILD-INFO-$TARGET.txt" 2>&1 || true
          fi
          ./target/release/tpe extract tests/fixtures/pdfium-unicode/existing-ocr.pdf --backend lopdf --db "$RUNNER_TEMP/alpha-smoke.sqlite" --out "$RUNNER_TEMP/alpha-smoke-output" --json > "dist/extraction-smoke-$TARGET.json"
          if [ "$ALPHA_CANDIDATE" = true ]; then
            cp docs/CLI_ALPHA.md dist/README.md
            cp docs/PUBLICATION.md dist/PUBLICATION.md
            cp LICENSE dist/LICENSE
          fi
      - name: Package
        run: |
          set -eu
          mkdir -p dist/stage
          cp target/release/tpe dist/stage/tpe
          chmod 0755 dist/stage/tpe
          tar -C dist/stage -czf "dist/tpe-$TARGET.tar.gz" tpe
          rm -r dist/stage
          (cd dist && shasum -a 256 "tpe-$TARGET.tar.gz" > "SHA256SUMS-$TARGET")
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tpe-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
