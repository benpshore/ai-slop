name: Release

# Manual releases: push a tag, e.g. `git tag v0.50.0 && git push --tags`.
# Merges to main are released automatically by auto-release.yml (whose
# token-pushed tags do not trigger this workflow). Builds the same binary
# archives as the automatic path and attaches them plus SHA256SUMS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tpe-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
