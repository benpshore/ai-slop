name: Release

# Publish: push a tag, e.g. `git tag v0.1.1 && git push --tags`.
# Every merge to main is also released automatically by auto-release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build, sign and archive macOS application
        run: |
          VERSION="${GITHUB_REF_NAME#v}" macos/package.sh dist
          ditto -c -k --sequesterRsrc --keepParent "dist/Text Processing Engine.app" dist/text-processing-engine-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app
          path: dist/text-processing-engine-macos.zip
          if-no-files-found: error

  release:
    needs: macos-app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Tag matches computed project version
        run: test "$(uvx uv-dynamic-versioning)" = "${GITHUB_REF_NAME#v}"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv audit --locked --preview-features audit-command
      - run: uv build
      - name: Tag matches Cargo.toml version
        run: test "v$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')" = "$GITHUB_REF_NAME"
      - run: cargo test
      - name: Build release binary
        run: |
          cargo build --release
          mkdir -p dist
          cp "target/release/text-processing-engine" "dist/text-processing-engine-$(uname -m)-linux"
          (cd dist && sha256sum -- * > SHA256SUMS)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-app
          path: dist
      - name: Refresh release checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
