name: Auto-release

# Every merge to main is a release: once this commit's `ci` check has passed,
# tag the next minor version and publish a GitHub release with the built
# wheel and sdist. The version is dynamic (uv-dynamic-versioning reads the
# tag), so nothing is committed and no PR is needed. Tags aren't covered by
# the protect-main ruleset. Run by hand (workflow_dispatch) to retry.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
      contents: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      version: ${{ steps.build.outputs.version }}
    env:
      SHA: ${{ github.sha }}
    steps:
      - name: Wait for this commit's ci check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 75); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // "pending"')
            case "$state" in
              success) exit 0 ;;
              pending) sleep 20 ;;
              *) echo "::error::ci concluded '$state' on $SHA; not releasing it"; exit 1 ;;
            esac
          done
          echo "::error::timed out waiting for ci on $SHA"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Already released?
        id: guard
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.guard.outputs.skip != 'true'
      - name: Tag, test, build
        if: steps.guard.outputs.skip != 'true'
        id: build
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          IFS=. read -r major minor _patch <<<"${latest#v}"
          version="${major:-0}.$((${minor:-0} + 1)).0"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version"
          uv sync --locked
          uv run pytest
          uv audit --locked --preview-features audit-command
          uv build
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.guard.outputs.skip != 'true'
        with:
          name: release-dist
          path: dist
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-dist
          path: dist
      - name: Push tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="v$VERSION" \
            -f message="v$VERSION" \
            -f object="$SHA" \
            -f type=commit \
            --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$tag_sha"
          gh release create "v$VERSION" dist/* --verify-tag --generate-notes
