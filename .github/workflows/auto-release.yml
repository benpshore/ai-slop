name: Auto-release

# Every merge to main is a release: once this commit's `ci` check has passed,
# compute the next minor version, build the `tpe` binaries for every target
# (build-binaries.yml), then tag the commit and publish a GitHub release
# with the archives and SHA256SUMS. The tag is pushed only after every build
# succeeded, so a failed build leaves no half-released version. Tags pushed
# with the workflow token do not trigger release.yml, which exists for
# manually pushed tags. Run by hand (workflow_dispatch) to retry.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.next.outputs.version }}
      skip: ${{ steps.next.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - name: Wait for this commit's ci check
        run: |
          set -euo pipefail
          for _ in $(seq 1 75); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // "pending"')
            case "$state" in
              success) exit 0 ;;
              pending) sleep 20 ;;
              *) echo "::error::ci concluded '$state' on $SHA; not releasing it"; exit 1 ;;
            esac
          done
          echo "::error::timed out waiting for ci on $SHA"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Next minor version (or skip when HEAD is already tagged)
        id: next
        run: |
          set -euo pipefail
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          IFS=. read -r major minor _patch <<<"${latest#v}"
          version="v${major:-0}.$((${minor:-0} + 1)).0"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next release: $version"

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: tpe-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -eu
          cd dist
          ls -l
          test -f tpe-aarch64-apple-darwin.tar.gz
          test -f tpe-aarch64-unknown-linux-gnu.tar.gz
          test -f tpe-x86_64-unknown-linux-gnu.tar.gz
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Tag and publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" dist/* --verify-tag --generate-notes
