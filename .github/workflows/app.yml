name: App

# Builds and tests PDFTextract (crates/tpe-app) on macOS: clippy and the
# crate's tests with GPUI compiled in, the release binary, and the assembled,
# ad-hoc-signed bundle as an artifact. Not part of the required `ci` check,
# and only runs when the crate, the dependency set (Cargo.toml, Cargo.lock)
# or this file changes, so engine PRs never queue macOS runners. GPUI is
# macOS-only in Cargo.toml (it needs libxkbcommon-x11 to link on Linux), so
# this is where the window compiles; the crate's engine-facing code
# (src/jobs.rs) is compiled and tested by the Linux `ci` legs.

on:
  workflow_dispatch:
  # On pull requests only for app changes; a workspace dependency bump is
  # checked on main after merge rather than on every PR (macOS runners queue).
  pull_request:
    paths:
      - crates/tpe-app/**
      - rust-toolchain.toml
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths:
      - crates/tpe-app/**
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/app.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup show active-toolchain
      - run: rustc --version --verbose && uname -m
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-app-macos-15-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-app-macos-15-
      - run: cargo fmt --check -p tpe-app
      - run: cargo clippy --locked -p tpe-app --all-targets -- -D warnings
      - run: cargo test --locked -p tpe-app
      - run: sh crates/tpe-app/bundle.sh
      - name: Bundle smoke test
        run: |
          set -eu
          APP=target/release/PDFTextract.app
          test -x "$APP/Contents/MacOS/PDFTextract"
          plutil -extract NSServices json -o - "$APP/Contents/Info.plist"
          plutil -extract CFBundleDocumentTypes json -o - "$APP/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" PDFTextract.app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PDFTextract.app
          path: PDFTextract.app.zip
