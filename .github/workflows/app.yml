name: App

# Builds and tests PDFTextract (crates/tpe-app) on macOS: clippy and the
# crate's tests with GPUI compiled in, the release binary, and the assembled,
# ad-hoc-signed bundle as an artifact. Not part of the required `ci` check,
# and only runs when the crate, the dependency set (Cargo.toml, Cargo.lock)
# or this file changes, so engine PRs never queue macOS runners. GPUI is
# macOS-only in Cargo.toml (it needs libxkbcommon-x11 to link on Linux), so
# this is where the window compiles; the crate's engine-facing code
# (src/jobs.rs) is compiled and tested by the Linux `ci` legs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/tpe-app/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths:
      - crates/tpe-app/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/app.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup component add clippy rustfmt
      - run: rustc --version --verbose && uname -m
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-app-macos-15-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-app-macos-15-
      - run: cargo fmt --check -p tpe-app
      - run: cargo clippy -p tpe-app --all-targets -- -D warnings
      - run: cargo test -p tpe-app
      - name: Interaction timings (release, GPUI test platform)
        run: |
          set -o pipefail
          cargo test -p tpe-app --release --bin tpe-app -- --ignored --nocapture interaction_timings 2>&1 | tee timings.log
          {
            echo "### Interaction timings"
            echo
            echo "$(uname -m), $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown CPU), macOS $(sw_vers -productVersion). GPUI test platform: view state, layout and scene building on the CPU; no GPU, no display."
            echo
            grep '^|' timings.log
          } >> "$GITHUB_STEP_SUMMARY"
      - run: sh crates/tpe-app/bundle.sh
      - name: Bundle smoke test
        run: |
          set -eu
          APP=target/release/PDFTextract.app
          test -x "$APP/Contents/MacOS/PDFTextract"
          plutil -extract NSServices json -o - "$APP/Contents/Info.plist"
          plutil -extract CFBundleDocumentTypes json -o - "$APP/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" PDFTextract.app.zip
      - name: Launch the bundle and open a PDF with it (the Open With path)
        run: |
          set -eu
          APP="$PWD/target/release/PDFTextract.app"
          dir=$(mktemp -d)
          cp crates/tpe-app/tests/fixtures/synthetic-paper.pdf "$dir/paper.pdf"
          # Launch Services hands the file to a cold app, as Finder's Open With does.
          open -a "$APP" "$dir/paper.pdf"
          for _ in $(seq 1 90); do [ -f "$dir/paper.txt" ] && break; sleep 1; done
          ls -la "$dir"
          test -f "$dir/paper.txt"
          grep -q 'Faithful Extraction of Citations from Academic PDFs' "$dir/paper.txt"
          pgrep -x PDFTextract >/dev/null
          echo "the app is running and wrote paper.txt"
          sleep 2
          # Window list through the system's JavaScript-for-Automation bridge
          # (no Swift anywhere in this app or its CI).
          cat > "$RUNNER_TEMP/windows.js" <<'JXA'
          ObjC.import('CoreGraphics');
          const all = ObjC.deepUnwrap(ObjC.castRefToObject(
            $.CGWindowListCopyWindowInfo($.kCGWindowListOptionOnScreenOnly, $.kCGNullWindowID))) || [];
          let found = 0;
          for (const w of all) {
            if (w.kCGWindowOwnerName === 'PDFTextract') {
              found += 1;
              console.log('window: ' + (w.kCGWindowName || '(untitled)') + ' ' + JSON.stringify(w.kCGWindowBounds));
            }
          }
          console.log('on-screen PDFTextract windows: ' + found);
          JXA
          osascript -l JavaScript "$RUNNER_TEMP/windows.js" 2>&1 | tee "$RUNNER_TEMP/windows.txt" || true
          screencapture -x "$RUNNER_TEMP/window.png" || echo "screencapture failed"
          ls -la "$RUNNER_TEMP/window.png" || true
          osascript -e 'tell application "PDFTextract" to quit' || true
          for _ in $(seq 1 20); do pgrep -x PDFTextract >/dev/null || break; sleep 1; done
          if pgrep -x PDFTextract >/dev/null; then
            echo "::warning::the app did not quit on request; killing it"
            pkill -x PDFTextract
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: PDFTextract-launch
          path: |
            ${{ runner.temp }}/window.png
            ${{ runner.temp }}/windows.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PDFTextract.app
          path: PDFTextract.app.zip
