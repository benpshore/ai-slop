name: App probe

# Runs the real PDFTextract bundle on a macOS runner with its responsiveness
# probe on (crates/tpe-app/probe.sh, docs/APP.md "Measuring the real app"):
# scripted keys and scrolling in the window, batches of 1, 50, 500 and 5,000
# PDFs handed over through Launch Services, one long PDF, 500 twenty-page
# PDFs; then the report (JSON and text) is uploaded as an artifact and printed
# in the job summary.
#
# Optional and NOT part of the required `ci` check. It never runs on ordinary
# pull requests or merges: only by hand (workflow_dispatch), or on a pull
# request that changes the probe itself. macOS runners were deliberately kept
# out of `ci` (a macOS run loop happened once); keep it that way.
#
# The runner is a virtualised Apple-silicon machine with a paravirtual GPU:
# its numbers say what this app does on that machine, not on a MacBook with a
# ProMotion display. See docs/APP.md for what they do and do not represent.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/tpe-app/probe.sh
      - crates/tpe-app/src/probe.rs
      - crates/tpe-app/src/gui/instrument.rs
      - .github/workflows/app-probe.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustc --version --verbose && uname -m
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-probe-macos-15-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-probe-macos-15-
            cargo-app-macos-15-
      - run: sh crates/tpe-app/bundle.sh
      - name: Run the probe against the real bundle
        run: |
          set -o pipefail
          sh crates/tpe-app/probe.sh --app "$PWD/target/release/PDFTextract.app" --out "$RUNNER_TEMP/probe" --screenshot 2>&1 | tee "$RUNNER_TEMP/probe-run.log"
      - name: Job summary
        if: always()
        run: |
          {
            echo "### App probe (real bundle, macOS runner)"
            echo
            echo "Virtualised Apple-silicon runner with a paravirtual GPU: not a MacBook, no ProMotion. See docs/APP.md."
            echo
            echo '```'
            cat "$RUNNER_TEMP/probe/environment.txt" 2>/dev/null | head -30
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/probe/report.txt" 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: PDFTextract-probe
          path: |
            ${{ runner.temp }}/probe/report.json
            ${{ runner.temp }}/probe/report.txt
            ${{ runner.temp }}/probe/environment.txt
            ${{ runner.temp }}/probe/driver.log
            ${{ runner.temp }}/probe/stderr.log
            ${{ runner.temp }}/probe/*.png
            ${{ runner.temp }}/probe-run.log
          if-no-files-found: warn
