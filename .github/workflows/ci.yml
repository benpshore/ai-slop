name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      evaluator: ${{ steps.paths.outputs.evaluator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether evaluator checks are required
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            required=true
          else
            if [ "$EVENT" = pull_request ]; then
              git diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/changed-paths"
            else
              git diff --name-only "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-paths"
            fi
            required=$(sh .github/scripts/evaluator-paths.sh < "$RUNNER_TEMP/changed-paths")
          fi
          echo "evaluator=$required" >> "$GITHUB_OUTPUT"

  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No junk, databases or secrets committed
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(\.DS_Store|\.env(\..+)?|[^/]+\.(db|sqlite3?|duckdb|pem|key|p12|pfx))$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::remove from git: $bad"; exit 1; fi
      - name: Verify required CI gating
        run: sh .github/tests/ci-gate.sh

  evaluation-tools:
    needs: changes
    if: needs.changes.outputs.evaluator == 'true'
    uses: ./.github/workflows/evaluation-tools.yml

  rust:
    # x86-64 Linux plus native ARM64 Linux (aarch64-unknown-linux-gnu).
    # Cross-compiling is not runtime verification, so each target runs its
    # own tests. No macOS runners: aarch64-apple-darwin is verified on a
    # developer machine (AGENTS.md), not in Actions.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: rustc --version --verbose && uname -m
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  # Repository policy and release automation require this aggregate to pass.
  ci:
    if: always()
    needs: [changes, repo, rust, evaluation-tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_RESULT: ${{ needs.repo.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          EVALUATOR_REQUIRED: ${{ needs.changes.outputs.evaluator }}
          EVALUATOR_RESULT: ${{ needs.evaluation-tools.result }}
        run: sh .github/scripts/check-ci.sh "$CHANGES_RESULT" "$REPO_RESULT" "$RUST_RESULT" "$EVALUATOR_REQUIRED" "$EVALUATOR_RESULT"
