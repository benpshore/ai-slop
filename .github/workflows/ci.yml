name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No junk, databases or secrets committed
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(\.DS_Store|\.env(\..+)?|[^/]+\.(db|sqlite3?|duckdb|pem|key|p12|pfx))$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::remove from git: $bad"; exit 1; fi

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - run: uv run pytest
      - run: uv audit --locked --preview-features audit-command
      - run: uv build

  rust:
    # x86-64 Linux plus both native ARM64 targets the engine ships for
    # (aarch64-unknown-linux-gnu, aarch64-apple-darwin). Cross-compiling is
    # not runtime verification, so each target runs its own tests.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - run: rustc --version --verbose && uname -m
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  swift:
    runs-on: ubuntu-latest
    # ubuntu-latest has no Swift toolchain (none at all from Ubuntu 26.04), so the
    # job runs inside the official image, pinned by digest (swift:6.4.0-noble).
    container: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build
      - run: swift test

  cmake:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  macos26:
    # This is part of the required ci gate so a release cannot race or bypass
    # validation of the native host and its embedded Share extension.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the documented toolchain
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test "$(xcodebuild -version | paste -sd ' ' -)" = "Xcode 26.0 Build version 17A324"
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.0
          test "$(swift --version | sed -n '1s/.*version \([0-9][0-9.]*\).*/\1/p')" = 6.2
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Swift tests, including NSItemProvider share smoke
        run: |
          swift test
          swift test --package-path macos
      - name: Build host application and Share extension
        run: ./macos/build-bundle.sh
      - name: Validate bundle metadata, sandbox and hardened runtime
        run: ./macos/validate-bundle.sh build/macos/TPE.app
      - name: Launch and Finder-open smoke tests
        run: ./macos/smoke-tests.sh build/macos/TPE.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unsigned-macos-26-validation-bundle
          path: build/macos/TPE.app

  # The single required check in the branch ruleset. It passes only if every job above passed.
  ci:
    if: always()
    needs: [repo, python, rust, swift, cmake, macos26]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
