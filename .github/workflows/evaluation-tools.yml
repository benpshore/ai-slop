name: Evaluation tools

# Python supports offline accuracy diagnostics only. Rust-only changes do not
# install Python dependencies, build a wheel, or run this workflow.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - run: uv run pytest
      - run: uv audit --locked --preview-features audit-command
