name: Registry accuracy smoke

# Live checks only for resolver changes or manual runs; outside the required ci gate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/resolve.rs
      - crates/tpe-biblio/src/pmc.rs
      - crates/tpe-biblio/src/crossref.rs
      - .github/workflows/registry-accuracy.yml

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ubuntu-latest-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-ubuntu-latest-
      - run: cargo test --locked --lib resolve::tests::live_ -- --ignored --nocapture --test-threads=1
