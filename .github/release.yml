# Layout of the generated release notes (`gh release create --generate-notes`
# in auto-release.yml and release.yml). Labels are optional: an unlabelled PR
# lands under "Changes". Dependabot adds `dependencies` itself. See
# docs/LIFECYCLE.md.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Security
      labels:
        - security
    - title: Native upstreams (PDFium, Docling, models)
      labels:
        - upstream
    - title: Dependencies
      labels:
        - dependencies
    - title: Changes
      labels:
        - "*"
