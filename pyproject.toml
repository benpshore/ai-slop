# Optional accuracy-evaluation tooling; no Python package or production entry point.
[project]
name = "pdftextract-evaluation"
dynamic = ["version"]
requires-python = ">=3.14"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
