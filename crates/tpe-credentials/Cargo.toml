[package]
name = "tpe-credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Credential storage (macOS Keychain, encrypted file, cookie jar) for the text-processing-engine workbench"

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
