[package]
name = "tpe-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPUI workbench skeleton: corpus list, document view and an Ask Claude / ChatGPT panel over the engine ledger"

[lib]
name = "tpe_app"
path = "src/lib.rs"

[[bin]]
name = "tpe-app"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
thiserror = "2"
tpe-common = { path = "../tpe-common" }
ureq = "3"

# macOS uses GPUI's built-in native Metal backend. `macos-blade` is deliberately
# not enabled: it selects GPUI's alternative Blade renderer.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false }

# Linux supports both display protocols so the same binary works in native
# Wayland sessions and X11/XWayland sessions. Building these backends requires
# pkg-config plus the fontconfig, Vulkan, Wayland and xkbcommon development
# libraries (Debian/Ubuntu packages are documented in the README).
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }

[lints]
workspace = true
