[package]
name = "tpe-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PDFTextract: the GPUI app over the engine (get text or bibliography per PDF), plus the workbench library modules"

[lib]
name = "tpe_app"
path = "src/lib.rs"

[[bin]]
name = "tpe-app"
path = "src/main.rs"

[dependencies]
futures = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
text-processing-engine = { path = "../.." }
thiserror = "2"
tpe-common = { path = "../tpe-common" }
ureq = "3"

[dev-dependencies]
tempfile = "3"

# GPUI is a macOS-only dependency. Its default features (`x11`, `wayland`,
# `font-kit`; gpui-0.2.2/Cargo.toml [features] default) pull x11rb, wayland-client,
# xkbcommon, zed-font-kit (fontconfig via dlopen), cosmic-text, ashpd, oo7 and
# blade-graphics (Vulkan) on Linux, which the CI runners do not provide. Keeping
# the dependency target-scoped means Linux builds never fetch or compile it.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = "0.2"
# The Finder Services provider (`services.rs`) is an Objective-C object
# declared at run time; `objc` is already in the tree through gpui.
objc = "0.2"

# The headless view tests (`src/gui/tests.rs`) need GPUI's test platform.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }

[lints]
workspace = true
