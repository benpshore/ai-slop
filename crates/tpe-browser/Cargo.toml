[package]
name = "tpe-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Research-browser session model: URL normalisation, DOI and PDF detection, scholarly-host policy and a cookie bridge; CEF embedding behind the `cef` feature"

[features]
default = []
# Chromium Embedded Framework bindings (tauri-apps/cef-rs). Off by default: the
# `cef-dll-sys` build needs a CEF binary distribution and is macOS-first. See
# docs/BROWSER.md; the embedding itself is still a documented TODO.
cef = ["dep:cef"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tpe-common = { path = "../tpe-common" }
cef = { version = "154", optional = true }

[lints]
workspace = true
