[package]
name = "tpe-zotero"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Zotero Web API v3 client, local zotero.sqlite reader and PaperRecord mapping"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tpe-common = { path = "../tpe-common" }
ureq = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
